<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 地图 - Leaflet</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        #map { height: 100%; width: 100%; }
        /* 图源切换控件美化 */
        .leaflet-control-layers {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 14px;
        }
        .leaflet-control-layers-base label {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .leaflet-control-layers-base label:hover {
            background: #f0f0f0;
        }
        /* 顶部信息栏 */
        .top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-family: system-ui, sans-serif;
            pointer-events: none;
        }
        .top-bar .logo {
            font-size: 18px;
            line-height: 1;
        }
        .top-bar .layer-name {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
        }
        .top-bar .sep {
            width: 1px;
            height: 18px;
            background: #d1d5db;
        }
        .top-bar .coords {
            font-size: 13px;
            color: #4b5563;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="logo">🗺️</span>
        <span class="layer-name" id="layerName">Web 地图查看器</span>
        <span class="sep"></span>
        <span class="coords" id="coords">纬度 --  经度 --</span>
    </div>
    <div id="map"></div>

    <script>
        // 图源配置
        const baseMaps = {
            'Arcgisonline': L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}.png', {
                attribution: '<a href="https://arcgisonline.com/">arcgisonline</a> contributors',
                maxZoom: 19
            }),
            'google': L.tileLayer('http://mt{s}.google.com/vt/lyrs=y&hl=zh-CN&gl=cn&scale=2&x={x}&y={y}&z={z}', {
                maxZoom: 21,
                subdomains: [0, 1, 2, 3]
            })
        };

        // 初始化地图，默认使用 Arcgisonline 卫星影像
        const map = L.map('map', {
            center: [39.9042, 116.4074], // 北京
            zoom: 12,
            layers: [baseMaps['Arcgisonline']]
        });

        // 添加图源切换控件
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // 添加比例尺（仅公制）
        L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

        // 实时显示鼠标经纬度
        const coords = document.getElementById('coords');
        map.on('mousemove', function (e) {
            const lat = e.latlng.lat;
            const lng = e.latlng.lng;
            const latD = lat >= 0 ? 'N' : 'S';
            const lngD = lng >= 0 ? 'E' : 'W';
            coords.textContent = '纬度 ' + Math.abs(lat).toFixed(5) + '° ' + latD +
                '  经度 ' + Math.abs(lng).toFixed(5) + '° ' + lngD;
        });
        map.on('mouseout', function () {
            coords.textContent = '纬度 --  经度 --';
        });

        // 添加当前图源名称显示
        map.on('baselayerchange', function (e) {
            document.getElementById('layerName').textContent = e.name;
        });
    </script>
</body>
</html>
