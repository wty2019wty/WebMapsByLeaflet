<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 地图 - Leaflet</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="lib/leaflet/leaflet.css">
    <!-- Leaflet JS -->
    <script src="lib/leaflet/leaflet.js"></script>
    <style>
        :root {
            --icon-size-sm: 20px;
            --icon-size-md: 24px;
            --icon-size-lg: 32px;
            --icon-size-xl: 36px;
        }

        @media (min-width: 768px) {
            :root {
                --icon-size-sm: 24px;
                --icon-size-md: 28px;
                --icon-size-lg: 36px;
                --icon-size-xl: 40px;
            }
            .top-bar .coords {
                min-width: 260px;
            }
        }

        @media (min-width: 1200px) {
            :root {
                --icon-size-sm: 28px;
                --icon-size-md: 32px;
                --icon-size-lg: 40px;
                --icon-size-xl: 44px;
            }
            .top-bar .coords {
                min-width: 280px;
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        #map { height: 100%; width: 100%; }
        .leaflet-grab { cursor: pointer; }

        /* 图源切换控件美化 */
        .leaflet-control-layers {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 14px;
        }
        .leaflet-control-layers-base label {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .leaflet-control-layers-base label:hover {
            background: #f0f0f0;
        }
        /* 顶部信息栏 */
        .top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-family: system-ui, sans-serif;
            pointer-events: auto;
        }
        .top-bar .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--icon-size-md);
            height: var(--icon-size-md);
        }
        .top-bar .layer-select {
            font-size: 14px;
            font-weight: 700;
            color: #111827;
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 2px 4px;
        }
        .top-bar .crs-badge {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 999px;
            color: #fff;
            background: #6366f1;
            white-space: nowrap;
        }
        .top-bar .sep {
            width: 1px;
            height: 18px;
            background: #d1d5db;
        }
        .top-bar .coords {
            font-size: 13px;
            color: #4b5563;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            letter-spacing: 0.2px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 6px;
            padding: 2px 6px;
            transition: background 0.2s;
            min-width: 240px;
            text-align: center;
            display: inline-block;
        }
        .top-bar .coords:hover {
            background: rgba(99, 102, 241, 0.12);
        }
        .top-bar .pin-btn {
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--icon-size-md);
            height: var(--icon-size-md);
            padding: 0;
            border-radius: 999px;
            border: none;
            background: transparent;
            filter: grayscale(1);
            transition: all 0.2s;
        }
        .top-bar .pin-btn:hover {
            transform: scale(1.15);
        }
        .top-bar .pin-btn.pinned {
            filter: none;
            background: rgba(239, 68, 68, 0.15);
        }
        .top-bar .coords.pinned {
            color: #dc2626;
            background: rgba(239, 68, 68, 0.12);
        }
        .top-bar .copy-btn {
            pointer-events: auto;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: var(--icon-size-md);
            height: var(--icon-size-md);
            padding: 0;
            border-radius: 999px;
            border: none;
            background: transparent;
            filter: grayscale(1);
            transition: all 0.2s;
        }
        .top-bar .copy-btn:hover {
            transform: scale(1.15);
        }
        /* Toast 弹窗 */
        .toast {
            position: fixed;
            top: 12px;
            right: 12px;
            padding: 12px 20px;
            background: #fff;
            color: #1f2937;
            border-radius: 12px;
            font-size: 14px;
            font-family: system-ui, sans-serif;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(0);
        }

        .leaflet-control-zoom-in {
            background-image: url('lib/leaflet/svg/add-square-svgrepo-com.svg');
            background-size: var(--icon-size-md) var(--icon-size-md);
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border: 0 !important;
            margin: 0;
            padding: 0;
            outline: none;
            box-shadow: none;
            width: calc(var(--icon-size-md) + 6px);
            height: calc(var(--icon-size-md) + 6px);
        }
        .leaflet-control-zoom-out {
            background-image: url('lib/leaflet/svg/minus-square-svgrepo-com.svg');
            background-size: var(--icon-size-md) var(--icon-size-md);
            background-position: center;
            background-repeat: no-repeat;
            background-color: transparent;
            border: 0 !important;
            margin: 0;
            padding: 0;
            outline: none;
            box-shadow: none;
            width: calc(var(--icon-size-md) + 6px);
            height: calc(var(--icon-size-md) + 6px);
        }


        .measure-tooltip {
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 12px;
            font-family: system-ui, sans-serif;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        /* 彻底清除缩放控件白色缝隙 */
        .leaflet-control-zoom.leaflet-bar {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            padding: 0 !important;
        }

        .leaflet-control-zoom-in,
        .leaflet-control-zoom-out {
            border: none !important;
            background: transparent !important;
            color: #fff !important;
            outline: none !important;
            margin: 0 !important;
            padding: 0 !important;
            background-size: var(--icon-size-md) var(--icon-size-md) !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
        }

        .leaflet-control-zoom-in {
            background-image: url('lib/leaflet/svg/add-square-svgrepo-com.svg') !important;
        }

        .leaflet-control-zoom-out {
            background-image: url('lib/leaflet/svg/minus-square-svgrepo-com.svg') !important;
        }

        /* 去除按钮之间分割线 */
        .leaflet-control-zoom a {
            border-bottom: none !important;
        }
    </style>
</head>
<body>
    <div class="top-bar" id="topBar">
        <span class="logo"><img src="lib/leaflet/svg/layers-svgrepo-com.svg" alt="layers" style="width: 100%; height: 100%;"></span>
        <select class="layer-select" id="layerSelect">
            <option value="google">Google 卫星</option>
            <option value="Arcgisonline">ArcGIS 卫星</option>
        </select>
        <span class="crs-badge" id="crsName">GCJ-02</span>
        <span class="sep"></span>
        <span class="coords" id="coords" title="当前坐标">纬度 --  经度 --</span>
        <button class="copy-btn" id="copyBtn" title="复制坐标"><img src="lib/leaflet/svg/copy-svgrepo-com.svg" alt="copy" style="width: 100%; height: 100%;"></button>
        <button class="pin-btn" id="pinBtn" title="固定当前坐标"><img src="lib/leaflet/svg/pin-svgrepo-com.svg" alt="pin" style="width: 100%; height: 100%;"></button>
        <button class="pin-btn" id="measureBtn" title="测量距离"><img src="lib/leaflet/svg/ruler-svgrepo-com.svg" alt="measure" style="width: 100%; height: 100%;"></button>
    </div>
    <div id="map"></div>
    <div class="toast" id="toast"></div>

    <script>
        // 图源配置（crs 标记坐标系：wgs84 或 gcj02）
        const baseMaps = {
            'Arcgisonline': L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}.png', {
                attribution: '<a href="https://arcgisonline.com/">arcgisonline</a> contributors',
                maxZoom: 19,
                crs: 'wgs84'
            }),
            'google': L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&hl=zh-CN&gl=cn&scale=2&x={x}&y={y}&z={z}', {
                maxZoom: 21,
                subdomains: [0, 1, 2, 3],
                crs: 'gcj02'
            })
        };

        // 当前底图的坐标系（默认底图为 google，是 GCJ-02 瓦片）
        let currentCRS = 'gcj02';

        // ---------- WGS-84 与 GCJ-02 互转（标准算法） ----------
        function outOfChina(lat, lng) {
            return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
        }

        function transformLat(x, y) {
            let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
            return ret;
        }

        function transformLng(x, y) {
            let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
            return ret;
        }

        function wgs84ToGcj02(lat, lng) {
            if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
            const a = 6378245.0;
            const ee = 0.00669342162296594323;
            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * Math.PI;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
            return { lat: lat + dLat, lng: lng + dLng };
        }

        function gcj02ToWgs84(lat, lng) {
            if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
            const wgs = wgs84ToGcj02(lat, lng);
            return { lat: 2 * lat - wgs.lat, lng: 2 * lng - wgs.lng };
        }

        // 将经纬度转到 WGS-84（用于显示）
        function toWgs84(lat, lng) {
            return currentCRS === 'gcj02' ? gcj02ToWgs84(lat, lng) : { lat: lat, lng: lng };
        }

        // 初始化地图，默认使用 google 卫星影像
        const map = L.map('map', {
            center: [30, 110],
            zoom: 4,
            zoomControl: false, // 禁用默认左上角缩放控件
            layers: [baseMaps['google']]
        });

        // 自定义图标
        const pinIcon = L.icon({
            iconUrl: 'lib/leaflet/svg/pin-svgrepo-com.svg',
            iconSize: [32, 32],
            iconAnchor: [16, 32],
            popupAnchor: [1, -32],
            tooltipAnchor: [16, -28]
        });

        // 添加比例尺（仅公制，左下角）
        L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

        // 缩放按钮放到左下角（比例尺上方）
        L.control.zoom({ position: 'bottomleft' }).addTo(map);

        // 阻止顶部栏点击冒泡到地图
        document.getElementById('topBar').addEventListener('click', function (e) {
            e.stopPropagation();
        });
        document.getElementById('topBar').addEventListener('contextmenu', function (e) {
            e.stopPropagation();
        });

        // 实时显示鼠标经纬度（统一换算为 WGS-84）
        const coords = document.getElementById('coords');
        const pinBtn = document.getElementById('pinBtn');
        const layerSelect = document.getElementById('layerSelect');
        let pinned = false;
        let pinnedW = null;
        let pinMarker = null;
        let currentLayer = baseMaps['google'];

        map.on('mousemove', function (e) {
            if (pinned) return;
            const w = toWgs84(e.latlng.lat, e.latlng.lng);
            coords.textContent = formatCoords(w.lat, w.lng);
        });
        map.on('mouseout', function () {
            if (pinned) return;
            coords.textContent = '纬度 --  经度 --';
        });

        // 格式化坐标文本
        function formatCoords(lat, lng) {
            const latD = lat >= 0 ? 'N' : 'S';
            const lngD = lng >= 0 ? 'E' : 'W';
            const crsLabel = currentCRS === 'gcj02' ? 'GCJ02' : 'WGS84';
            return '【' + crsLabel + '】' + Math.abs(lat).toFixed(8) + '°' + latD +
                '，' + Math.abs(lng).toFixed(8) + '°' + lngD;
        }

        // 固定坐标（显示 + 标记）
        function setPinned(w) {
            pinned = true;
            pinnedW = w;
            coords.textContent = formatCoords(w.lat, w.lng);
            pinBtn.classList.add('pinned');
            coords.classList.add('pinned');
            if (pinMarker) map.removeLayer(pinMarker);
            // 标记需放在地图/瓦片坐标系，pinnedW 仅用于显示与复制
            const m = currentCRS === 'gcj02' ? wgs84ToGcj02(w.lat, w.lng) : w;
            pinMarker = L.marker([m.lat, m.lng], {icon: pinIcon}).addTo(map);
            pinBtn.title = '取消固定';
        }

        // 取消固定
        function clearPinned() {
            pinned = false;
            pinnedW = null;
            coords.textContent = '纬度 --  经度 --';
            pinBtn.classList.remove('pinned');
            coords.classList.remove('pinned');
            if (pinMarker) {
                map.removeLayer(pinMarker);
                pinMarker = null;
            }
            pinBtn.title = '固定当前坐标';
        }

        // 左键点击地图：固定该点经纬度（测量模式下不固定）
        map.on('click', function (e) {
            if (measureMode) return;
            setPinned(toWgs84(e.latlng.lat, e.latlng.lng));
        });

        // 右键点击地图：取消固定（测量模式下右键用于拖动地图，不取消固定）
        map.on('contextmenu', function (e) {
            if (measureMode) return;
            if (pinned) {
                clearPinned();
            }
        });

        // 📌 按钮：固定/取消固定当前地图中心
        pinBtn.addEventListener('click', function () {
            if (pinned) {
                clearPinned();
            } else {
                setPinned(toWgs84(map.getCenter().lat, map.getCenter().lng));
            }
        });

        // 复制按钮
        const copyBtn = document.getElementById('copyBtn');
        copyBtn.addEventListener('click', async function () {
            const text = pinned ? formatCoords(pinnedW.lat, pinnedW.lng) : coords.textContent;
            if (!text || text.indexOf('--') !== -1) return;
            try {
                await navigator.clipboard.writeText(text);
                showToast('已复制坐标');
            } catch (e) {
                showToast('复制失败');
            }
        });

        // 测量工具
        let measureMode = false;
        let measurePoints = [];
        let measureLine = null;
        let measureTooltip = null;
        let rightDrag = null;
        const measureBtn = document.getElementById('measureBtn');

        measureBtn.addEventListener('click', function () {
            if (measureMode) {
                exitMeasureMode();
            } else {
                enterMeasureMode();
            }
        });

        function enterMeasureMode() {
            measureMode = true;
            measureBtn.classList.add('pinned');
            measureBtn.title = '退出测量';
            map.getContainer().style.cursor = 'crosshair';
            map.doubleClickZoom.disable();
            map.on('click', onMeasureClick);
            map.on('dblclick', onMeasureDoubleClick);
            map.getContainer().addEventListener('contextmenu', preventContextMenu);
            map.on('mousedown', onRightMouseDown);
            map.on('mousemove', onRightMouseMove);
            map.on('mouseup', onRightMouseUp);
        }

        function exitMeasureMode() {
            measureMode = false;
            measureBtn.classList.remove('pinned');
            measureBtn.title = '测量距离';
            map.getContainer().style.cursor = '';
            map.off('click', onMeasureClick);
            map.off('dblclick', onMeasureDoubleClick);
            map.doubleClickZoom.enable();
            map.getContainer().removeEventListener('contextmenu', preventContextMenu);
            map.off('mousedown', onRightMouseDown);
            map.off('mousemove', onRightMouseMove);
            map.off('mouseup', onRightMouseUp);
            rightDrag = null;
            clearMeasure();
        }

        function preventContextMenu(e) {
            e.preventDefault();
        }

        // 测量模式下右键拖拽平移地图
        function onRightMouseDown(e) {
            const oe = e.originalEvent;
            if (oe.button === 2) {
                rightDrag = { x: oe.clientX, y: oe.clientY };
                L.DomEvent.stop(e);
            }
        }

        function onRightMouseMove(e) {
            if (!rightDrag) return;
            const oe = e.originalEvent;
            const dx = oe.clientX - rightDrag.x;
            const dy = oe.clientY - rightDrag.y;
            rightDrag = { x: oe.clientX, y: oe.clientY };
            map.panBy([-dx, -dy], { animate: false });
        }

        function onRightMouseUp(e) {
            if (e.originalEvent.button === 2) {
                rightDrag = null;
            }
        }

        function onMeasureClick(e) {
            // 双击会先触发两次 click，忽略第二次（detail>=2），避免末端误加重复点
            if (e.originalEvent && e.originalEvent.detail >= 2) return;
            measurePoints.push(e.latlng);
            if (measurePoints.length === 1) {
                // 第一个点，创建线
                measureLine = L.polyline(measurePoints, { color: '#ef4444', weight: 2, dashArray: '5,5' }).addTo(map);
            } else {
                // 更新线
                measureLine.setLatLngs(measurePoints);
            }
            // 更新距离提示
            updateMeasureTooltip();
        }

        function onMeasureDoubleClick(e) {
            // 双击结束测量
            L.DomEvent.stopPropagation(e);
            exitMeasureMode();
        }

        function updateMeasureTooltip() {
            if (measureTooltip) {
                map.removeLayer(measureTooltip);
            }
            if (measurePoints.length < 2) return;
            let totalDistance = 0;
            for (let i = 1; i < measurePoints.length; i++) {
                totalDistance += measurePoints[i - 1].distanceTo(measurePoints[i]);
            }
            const lastPoint = measurePoints[measurePoints.length - 1];
            let distanceText;
            if (totalDistance < 1000) {
                distanceText = totalDistance.toFixed(1) + ' 米';
            } else {
                distanceText = (totalDistance / 1000).toFixed(2) + ' 公里';
            }
            measureTooltip = L.tooltip({ permanent: true, className: 'measure-tooltip' })
                .setContent(distanceText)
                .setLatLng(lastPoint)
                .addTo(map);
        }

        function clearMeasure() {
            if (measureLine) {
                map.removeLayer(measureLine);
                measureLine = null;
            }
            if (measureTooltip) {
                map.removeLayer(measureTooltip);
                measureTooltip = null;
            }
            measurePoints = [];
        }

        // Toast 弹窗
        let toastTimer = null;
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toast.classList.remove('show');
            }, 1500);
        }

        // 图层选择下拉框：切换底图，保持中心点物理位置不变（换算坐标系），并更新徽标
        function switchLayer(name) {
            const layer = baseMaps[name];
            if (!layer || layer === currentLayer) return;
            const nextCRS = layer.options.crs || 'wgs84';
            map.removeLayer(currentLayer);
            currentLayer = layer;
            map.addLayer(currentLayer);
            layerSelect.value = name;
            document.getElementById('crsName').textContent = nextCRS === 'gcj02' ? 'GCJ-02' : 'WGS-84';

            if (nextCRS !== currentCRS) {
                const c = map.getCenter();
                const wgs = currentCRS === 'gcj02' ? gcj02ToWgs84(c.lat, c.lng) : { lat: c.lat, lng: c.lng };
                const target = nextCRS === 'gcj02' ? wgs84ToGcj02(wgs.lat, wgs.lng) : wgs;
                map.setView([target.lat, target.lng], map.getZoom(), { animate: false });
                // 已固定的标记同步换算，保持在同一物理位置
                if (pinMarker && pinnedW) {
                    const mt = nextCRS === 'gcj02' ? wgs84ToGcj02(pinnedW.lat, pinnedW.lng) : pinnedW;
                    pinMarker.setLatLng([mt.lat, mt.lng]);
                }
                currentCRS = nextCRS;
            }
        }

        layerSelect.addEventListener('change', function () {
            switchLayer(this.value);
        });
    </script>
</body>
</html>
