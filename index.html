<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 地图 - Leaflet</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="lib/leaflet/leaflet.css">
    <!-- Leaflet JS -->
    <script src="lib/leaflet/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        #map { height: 100%; width: 100%; }
        /* 图源切换控件美化 */
        .leaflet-control-layers {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 14px;
        }
        .leaflet-control-layers-base label {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .leaflet-control-layers-base label:hover {
            background: #f0f0f0;
        }
        /* 顶部信息栏 */
        .top-bar {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 20px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.92);
            color: #1f2937;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-family: system-ui, sans-serif;
            pointer-events: none;
        }
        .top-bar .logo {
            font-size: 18px;
            line-height: 1;
        }
        .top-bar .layer-name {
            font-size: 15px;
            font-weight: 700;
            color: #111827;
            white-space: nowrap;
        }
        .top-bar .crs-badge {
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            padding: 2px 10px;
            border-radius: 999px;
            color: #fff;
            background: #6366f1;
            white-space: nowrap;
        }
        .top-bar .sep {
            width: 1px;
            height: 18px;
            background: #d1d5db;
        }
        .top-bar .coords {
            font-size: 13px;
            color: #4b5563;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            letter-spacing: 0.2px;
            cursor: pointer;
            pointer-events: auto;
            border-radius: 6px;
            padding: 2px 6px;
            transition: background 0.2s;
        }
        .top-bar .coords:hover {
            background: rgba(99, 102, 241, 0.12);
        }
        .top-bar .pin-btn {
            pointer-events: auto;
            cursor: pointer;
            font-size: 15px;
            line-height: 1;
            padding: 4px 7px;
            border-radius: 999px;
            border: none;
            background: transparent;
            filter: grayscale(1);
            transition: all 0.2s;
        }
        .top-bar .pin-btn:hover {
            transform: scale(1.15);
        }
        .top-bar .pin-btn.pinned {
            filter: none;
            background: rgba(239, 68, 68, 0.15);
        }
        .top-bar .coords.pinned {
            color: #dc2626;
            background: rgba(239, 68, 68, 0.12);
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <span class="logo">🗺️</span>
        <span class="layer-name" id="layerName">Web 地图查看器</span>
        <span class="crs-badge" id="crsName">WGS-84</span>
        <span class="sep"></span>
        <span class="coords" id="coords" title="点击复制坐标">纬度 --  经度 --</span>
        <button class="pin-btn" id="pinBtn" title="固定当前坐标">📌</button>
    </div>
    <div id="map"></div>

    <script>
        // 图源配置（crs 标记坐标系：wgs84 或 gcj02）
        const baseMaps = {
            'Arcgisonline': L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}.png', {
                attribution: '<a href="https://arcgisonline.com/">arcgisonline</a> contributors',
                maxZoom: 19,
                crs: 'gcj02'
            }),
            'google': L.tileLayer('http://mt{s}.google.com/vt/lyrs=y&hl=zh-CN&gl=cn&scale=2&x={x}&y={y}&z={z}', {
                maxZoom: 21,
                subdomains: [0, 1, 2, 3],
                crs: 'gcj02'
            })
        };

        // 当前底图的坐标系
        let currentCRS = 'wgs84';

        // ---------- WGS-84 与 GCJ-02 互转（标准算法） ----------
        function outOfChina(lat, lng) {
            return (lng < 72.004 || lng > 137.8347) || (lat < 0.8293 || lat > 55.8271);
        }

        function transformLat(x, y) {
            let ret = -100.0 + 2.0 * x + 3.0 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(y * Math.PI) + 40.0 * Math.sin(y / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (160.0 * Math.sin(y / 12.0 * Math.PI) + 320 * Math.sin(y * Math.PI / 30.0)) * 2.0 / 3.0;
            return ret;
        }

        function transformLng(x, y) {
            let ret = 300.0 + x + 2.0 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
            ret += (20.0 * Math.sin(6.0 * x * Math.PI) + 20.0 * Math.sin(2.0 * x * Math.PI)) * 2.0 / 3.0;
            ret += (20.0 * Math.sin(x * Math.PI) + 40.0 * Math.sin(x / 3.0 * Math.PI)) * 2.0 / 3.0;
            ret += (150.0 * Math.sin(x / 12.0 * Math.PI) + 300.0 * Math.sin(x / 30.0 * Math.PI)) * 2.0 / 3.0;
            return ret;
        }

        function wgs84ToGcj02(lat, lng) {
            if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
            const a = 6378245.0;
            const ee = 0.00669342162296594323;
            let dLat = transformLat(lng - 105.0, lat - 35.0);
            let dLng = transformLng(lng - 105.0, lat - 35.0);
            const radLat = lat / 180.0 * Math.PI;
            let magic = Math.sin(radLat);
            magic = 1 - ee * magic * magic;
            const sqrtMagic = Math.sqrt(magic);
            dLat = (dLat * 180.0) / ((a * (1 - ee)) / (magic * sqrtMagic) * Math.PI);
            dLng = (dLng * 180.0) / (a / sqrtMagic * Math.cos(radLat) * Math.PI);
            return { lat: lat + dLat, lng: lng + dLng };
        }

        function gcj02ToWgs84(lat, lng) {
            if (outOfChina(lat, lng)) return { lat: lat, lng: lng };
            const wgs = wgs84ToGcj02(lat, lng);
            return { lat: 2 * lat - wgs.lat, lng: 2 * lng - wgs.lng };
        }

        // 将经纬度转到 WGS-84（用于显示）
        function toWgs84(lat, lng) {
            return currentCRS === 'gcj02' ? gcj02ToWgs84(lat, lng) : { lat: lat, lng: lng };
        }

        // 初始化地图，默认使用 google 卫星影像
        const map = L.map('map', {
            center: [30, 110],
            zoom: 4,
            zoomControl: false, // 禁用默认左上角缩放控件
            layers: [baseMaps['google']]
        });

        // 缩放按钮放到右下角，避免与顶部信息栏重叠
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // 添加图源切换控件
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // 添加比例尺（仅公制）
        L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);

        // 实时显示鼠标经纬度（统一换算为 WGS-84）
        const coords = document.getElementById('coords');
        const pinBtn = document.getElementById('pinBtn');
        let pinned = false;
        let pinnedW = null;
        let pinMarker = null;

        map.on('mousemove', function (e) {
            if (pinned) return;
            const w = toWgs84(e.latlng.lat, e.latlng.lng);
            coords.textContent = formatCoords(w.lat, w.lng);
        });
        map.on('mouseout', function () {
            if (pinned) return;
            coords.textContent = '纬度 --  经度 --';
        });

        // 格式化坐标文本（WGS-84）
        function formatCoords(lat, lng) {
            const latD = lat >= 0 ? 'N' : 'S';
            const lngD = lng >= 0 ? 'E' : 'W';
            return '纬度 ' + Math.abs(lat).toFixed(5) + '° ' + latD +
                '  经度 ' + Math.abs(lng).toFixed(5) + '° ' + lngD;
        }

        // 固定坐标（显示 + 标记）
        function setPinned(w) {
            pinned = true;
            pinnedW = w;
            coords.textContent = formatCoords(w.lat, w.lng);
            pinBtn.classList.add('pinned');
            coords.classList.add('pinned');
            if (pinMarker) map.removeLayer(pinMarker);
            pinMarker = L.marker([w.lat, w.lng]).addTo(map);
            pinBtn.title = '取消固定';
        }

        // 取消固定
        function clearPinned() {
            pinned = false;
            pinnedW = null;
            coords.textContent = '纬度 --  经度 --';
            pinBtn.classList.remove('pinned');
            coords.classList.remove('pinned');
            if (pinMarker) {
                map.removeLayer(pinMarker);
                pinMarker = null;
            }
            pinBtn.title = '固定当前坐标';
        }

        // 左键点击地图：固定该点经纬度
        map.on('click', function (e) {
            setPinned(toWgs84(e.latlng.lat, e.latlng.lng));
        });

        // 📌 按钮：固定/取消固定当前地图中心
        pinBtn.addEventListener('click', function () {
            if (pinned) {
                clearPinned();
            } else {
                setPinned(toWgs84(map.getCenter().lat, map.getCenter().lng));
            }
        });

        // 点击坐标复制到剪贴板
        coords.addEventListener('click', async function () {
            const text = pinned ? formatCoords(pinnedW.lat, pinnedW.lng) : coords.textContent;
            if (!text || text.indexOf('--') !== -1) return;
            try {
                await navigator.clipboard.writeText(text);
                const old = coords.textContent;
                coords.textContent = '已复制 ✓';
                setTimeout(function () {
                    coords.textContent = pinned ? formatCoords(pinnedW.lat, pinnedW.lng) : old;
                }, 1200);
            } catch (e) {
                coords.textContent = '复制失败';
            }
        });

        // 切换底图时：保持中心点物理位置不变（换算坐标系），并更新徽标
        map.on('baselayerchange', function (e) {
            const layer = e.layer;
            const nextCRS = layer.options.crs || 'wgs84';
            document.getElementById('layerName').textContent = e.name;
            document.getElementById('crsName').textContent = nextCRS === 'gcj02' ? 'GCJ-02' : 'WGS-84';

            if (nextCRS !== currentCRS) {
                const c = map.getCenter();
                const wgs = currentCRS === 'gcj02' ? gcj02ToWgs84(c.lat, c.lng) : { lat: c.lat, lng: c.lng };
                const target = nextCRS === 'gcj02' ? wgs84ToGcj02(wgs.lat, wgs.lng) : wgs;
                map.setView([target.lat, target.lng], map.getZoom(), { animate: false });
                // 已固定的标记同步换算，保持在同一物理位置
                if (pinMarker) {
                    const mwgs = pinnedW;
                    const mt = nextCRS === 'gcj02' ? wgs84ToGcj02(mwgs.lat, mwgs.lng) : mwgs;
                    pinMarker.setLatLng([mt.lat, mt.lng]);
                }
                currentCRS = nextCRS;
            }
        });
    </script>
</body>
</html>
