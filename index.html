<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web 地图 - Leaflet</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        #map { height: 100%; width: 100%; }
        /* 图源切换控件美化 */
        .leaflet-control-layers {
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 14px;
        }
        .leaflet-control-layers-base label {
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .leaflet-control-layers-base label:hover {
            background: #f0f0f0;
        }
        /* 顶部标题栏 */
        .title-bar {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 20px;
            border-radius: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-family: system-ui, sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #333;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>
    <div class="title-bar">🗺️ Web 地图查看器</div>
    <div id="map"></div>

    <script>
        // 图源配置
        const baseMaps = {
            'Arcgisonline': L.tileLayer('https://server.arcgisonline.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}.png', {
                attribution: '<a href="https://arcgisonline.com/">arcgisonline</a> contributors',
                maxZoom: 19
            }),
            'google': L.tileLayer('http://mt{s}.google.com/vt/lyrs=y&hl=zh-CN&gl=cn&scale=2&x={x}&y={y}&z={z}', {
                maxZoom: 21,
                subdomains: [0, 1, 2, 3]
            })
        };

        // 初始化地图，默认使用 Arcgisonline 卫星影像
        const map = L.map('map', {
            center: [39.9042, 116.4074], // 北京
            zoom: 12,
            layers: [baseMaps['Arcgisonline']]
        });

        // 添加图源切换控件
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        // 添加比例尺
        L.control.scale({ position: 'bottomleft' }).addTo(map);

        // 添加当前图源名称显示
        map.on('baselayerchange', function (e) {
            const title = document.querySelector('.title-bar');
            title.textContent = '🗺️ ' + e.name;
        });
    </script>
</body>
</html>
